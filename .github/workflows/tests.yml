name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scripts are executable in git
        # the PVE hook shim execs vibe-sandbox.sh directly from a clone
        run: |
          bad=0
          for f in vibe-sandbox.sh vscode-connect.sh tests/run-tests.sh tests/mock/bin/*; do
            mode="$(git ls-files -s -- "$f" | cut -d' ' -f1)"
            [ "$mode" = 100755 ] || { echo "::error file=$f::mode $mode, expected 100755 (git update-index --chmod=+x $f)"; bad=1; }
          done
          exit "$bad"

      - name: CHANGELOG has an entry for VIBE_SANDBOX_VERSION
        run: |
          ver="$(sed -n 's/^VIBE_SANDBOX_VERSION="\(.*\)"$/\1/p' vibe-sandbox.sh)"
          [ -n "$ver" ] || { echo "::error file=vibe-sandbox.sh::VIBE_SANDBOX_VERSION not found"; exit 1; }
          grep -q "^## $ver - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no '## $ver - YYYY-MM-DD' entry for VIBE_SANDBOX_VERSION=$ver"; exit 1; }

      - name: Syntax check
        run: |
          bash -n vibe-sandbox.sh
          bash -n vscode-connect.sh
          bash -n tests/run-tests.sh

      - name: ShellCheck
        run: shellcheck -S warning vibe-sandbox.sh vscode-connect.sh tests/run-tests.sh tests/mock/bin/*

      - name: Dry-run tests (mock Proxmox)
        # needs root for /run/lock; refuses to run where /etc/pve exists
        run: sudo bash tests/run-tests.sh
